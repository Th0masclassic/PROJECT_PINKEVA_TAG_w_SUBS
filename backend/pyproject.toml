[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pinqeva-provisioning-api"
version = "0.1.0"
description = "Authenticated Pinqeva App-to-Tag provisioning API"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44,<47",
    "fastapi>=0.115,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "PyJWT[crypto]>=2.10,<3",
    "stripe>=15.5,<16",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
