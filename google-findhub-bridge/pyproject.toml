[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pinqeva-google-findhub-bridge"
version = "0.1.0"
description = "Isolated HTTP adapter for a pinned GoogleFindMyTools checkout"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["pinqeva_google_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
