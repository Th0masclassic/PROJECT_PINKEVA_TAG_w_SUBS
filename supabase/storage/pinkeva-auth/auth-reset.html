<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pinkeva</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f9ff; color: #07183f; }
      main { box-sizing: border-box; width: min(92vw, 420px); padding: 40px 28px 34px; border: 1px solid #e3e8f4; border-radius: 26px; background: #fff; box-shadow: 0 18px 54px rgba(14, 38, 93, .12); text-align: center; }
      .mark { width: 62px; height: 62px; margin: 0 auto 22px; display: grid; place-items: center; border-radius: 20px; background: #071c54; color: #fff; font-size: 30px; font-weight: 800; }
      h1 { margin: 0 0 12px; font-size: 27px; letter-spacing: -.4px; }
      p { margin: 0 auto 24px; color: #63708a; line-height: 1.55; font-size: 16px; }
      a { display: inline-block; min-width: 190px; padding: 14px 20px; border-radius: 14px; background: #0b43d8; color: #fff; text-decoration: none; font-weight: 750; }
      small { display: block; margin-top: 18px; color: #7b879d; line-height: 1.45; }
      [hidden] { display: none; }
    </style>
  </head>
  <body data-default-flow="reset">
    <main>
      <div class="mark" aria-hidden="true">P</div>
      <h1 id="title">Recovery link ready</h1>
      <p id="body">Open the app to choose a new password.</p>
      <a id="open" href="com.pinkeva.mobile://auth/reset">Open Pinkeva</a>
      <small id="note">If the app does not open, install Pinkeva on this device and tap the button again.</small>
    </main>
    <script>
      (() => {
        const appScheme = 'com.pinkeva.mobile';
        const defaultRecovery = document.body.dataset.defaultFlow === 'reset';
        const query = new URLSearchParams(window.location.search);
        const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        const get = (key) => query.get(key) || hash.get(key);
        const recovery = defaultRecovery || get('type') === 'recovery';
        const appUrl = new URL(`${appScheme}://${recovery ? 'auth/reset' : 'auth/callback'}`);
        ['code', 'type', 'error', 'error_code', 'error_description', 'access_token', 'refresh_token', 'expires_in', 'token_type']
          .forEach((key) => {
            const value = get(key);
            if (value) appUrl.searchParams.set(key, value);
          });

        const portuguese = (navigator.language || '').toLowerCase().startsWith('pt');
        const error = Boolean(get('error') || get('error_code'));
        const hasCode = Boolean(get('code') || get('access_token'));
        const title = document.getElementById('title');
        const body = document.getElementById('body');
        const open = document.getElementById('open');
        const note = document.getElementById('note');
        open.href = appUrl.toString();

        if (error) {
          title.textContent = portuguese ? 'Não foi possível continuar' : 'Recovery could not be completed';
          body.textContent = portuguese
            ? 'Volte à Pinkeva e peça um novo link de recuperação.'
            : 'Return to Pinkeva and request a new recovery link.';
        } else if (!hasCode) {
          title.textContent = portuguese ? 'Link inválido ou expirado' : 'Invalid or expired link';
          body.textContent = portuguese
            ? 'Peça um novo link de recuperação na aplicação.'
            : 'Request a new recovery link from the app.';
        } else {
          title.textContent = portuguese ? 'Link de recuperação pronto' : 'Recovery link ready';
          body.textContent = portuguese
            ? 'Abra a aplicação para escolher uma nova palavra-passe.'
            : 'Open the app to choose a new password.';
        }
        open.textContent = portuguese ? 'Abrir Pinkeva' : 'Open Pinkeva';
        note.textContent = portuguese
          ? 'Se a aplicação não abrir, instale a Pinkeva neste dispositivo e toque novamente no botão.'
          : 'If the app does not open, install Pinkeva on this device and tap the button again.';
      })();
    </script>
  </body>
</html>
